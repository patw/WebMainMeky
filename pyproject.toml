[project]
name = "webmainmeky"
version = "0.4.0"
description = "Main-content extraction service: deterministic inference, layout-signature rule store (moofile), LLM used only to author rules off the hot path."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "lxml>=5.2",
    "requests>=2.31",
    "openai>=1.40",
    "moofile>=1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
eval = ["jieba>=0.42", "rouge-score>=0.1.2", "rapidfuzz>=3.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wmm"]
